services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro
      MARIADB_USER: usercompro_2388010036
      MARIADB_PASSWORD: 12345
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/dbcompro.sql:/docker-entrypoint-initdb.d/dbcompro.sql
    restart: always

  container-statis:
    image: ochakhosyyatillah/compro-2388010036:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: ochakhosyyatillah/web-dinamis:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_HOST: db-webdinamis
      DB_USER: usercompro_2388010036
      DB_PASSWORD: 12345
      DB_NAME: dbcompro
      NEXTAUTH_SECRET: ganti-dengan-string-acak-panjang-minimal-32-karakter
      NEXTAUTH_URL: http:// 54.252.195.192
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}