services:

  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: db_uas
      MARIADB_USER: UASocha_036
      MARIADB_PASSWORD: uas123
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/db_uas.sql:/docker-entrypoint-initdb.d/db_uas.sql
    restart: always

  container-statis:
    image: ochakhosyyatillah/uas_khosyyatillah:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: ochakhosyyatillah/web-dinamis_uas_036:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      - DB_HOST=db-webdinamis
      - DB_USER=UASocha_036
      - DB_PASSWORD=uas123
      - DB_NAME=db_uas
      - DB_PORT=3306
      - NEXTAUTH_SECRET=ganti-dengan-string-acak-panjang-minimal-32-karakter
      - NEXTAUTH_URL=http://47.128.216.70:3000
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}